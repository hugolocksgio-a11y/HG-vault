<style>
:root{color-scheme:dark;--bg:#08070d;--panel:#13111d;--panel2:#1a1726;--purple:#a855f7;--bright:#c084fc;--text:#f7f2ff;--muted:#aaa1ba;--line:#30283e;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#28143f 0,transparent 52%),var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:11px 14px}button.primary{background:linear-gradient(135deg,#9333ea,#6d28d9);border-color:#a855f7;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}input,textarea{width:100%;background:#0e0c15;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px;outline:none}input:focus,textarea:focus{border-color:var(--purple)}textarea{resize:vertical;min-height:120px}.hidden{display:none!important}.screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.auth{width:min(100%,370px);text-align:center}.logo{width:70px;height:70px;border-radius:23px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,#a855f7,#4c1d95);box-shadow:0 12px 45px #9333ea40;font-size:28px;font-weight:900}.sub{color:var(--muted);line-height:1.5}.auth form{display:grid;gap:12px;margin-top:25px}.pin{font-size:24px;text-align:center;letter-spacing:12px;cursor:pointer}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:3px}.keypad button{height:55px;border-radius:16px;font-size:22px;font-weight:650;background:#171321;border-color:#382849;display:flex;align-items:center;justify-content:center}.keypad button:active{background:#38204f;border-color:var(--purple)}.keypad .face-key{font-size:23px;color:var(--bright);flex-direction:column;gap:2px}.keypad .face-key span{font-size:10px;font-weight:600}.hint{font-size:12px;color:var(--muted);margin-top:16px}.app{max-width:900px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));min-height:100dvh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.eyebrow{color:var(--bright);font-size:11px;letter-spacing:2px;font-weight:800}.top h1{font-size:25px;margin:4px 0 0}.iconbtn{padding:10px 12px}.panel{background:#13111ddd;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 12px 35px #0002}.welcome{background:linear-gradient(115deg,#24143a,#171020 65%);border-color:#563577;padding:21px}.welcome h2{margin:8px 0;font-size:22px}.muted{color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.sectionhead h2{font-size:17px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0d0b13;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:10px}.tile img,.tile video{display:block;width:100%;aspect-ratio:1.25;object-fit:cover;border-radius:10px;background:#0c0a12}.tile h3{font-size:14px;margin:10px 0 4px;overflow-wrap:anywhere}.tile p{font-size:12px;color:var(--muted);margin:0 0 9px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{padding:8px 10px;font-size:12px}.list{display:grid;gap:10px}.listrow{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0}.listrow .info{min-width:0;flex:1}.listrow h3{font-size:14px;margin:0 0 4px;overflow-wrap:anywhere}.listrow p{font-size:12px;color:var(--muted);margin:0;overflow-wrap:anywhere}.listrow .actions{justify-content:flex-end}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 8px calc(8px + env(safe-area-inset-bottom));background:#0c0a12ee;backdrop-filter:blur(22px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav{border:0;background:transparent;padding:8px 2px;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:12px}.nav .ico{font-size:20px}.nav.active{color:var(--bright);background:#8b5cf61c}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:6px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;z-index:20;bottom:100px;left:50%;transform:translateX(-50%);background:#2b2040;border:1px solid #7046a4;padding:11px 16px;border-radius:13px;max-width:90%;box-shadow:0 10px 30px #0008}.notecontent{white-space:pre-wrap;overflow-wrap:anywhere;color:#d8d0e4;font-size:13px;max-height:80px;overflow:hidden}.disclaimer{font-size:12px;color:var(--muted);line-height:1.5}.danger{color:var(--danger)}a{color:var(--bright)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app{padding-left:28px;padding-right:28px}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(100%,900px);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}.panel{padding:21px}}
</style></head>
<body>
<div id="authScreen" class="screen"><div class="auth"><div class="logo">HG</div><div class="eyebrow">PRIVATE SPACE</div><h1 id="authTitle">Welcome to HG Vault</h1><p id="authSub" class="sub">Create a six-digit PIN to set up your private vault.</p><form id="authForm"><input id="pinInput" class="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="off" placeholder="••••••" required aria-label="PIN"><input id="confirmPin" class="pin hidden" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="Confirm PIN" aria-label="Confirm PIN"><div class="keypad" aria-label="PIN keypad"><button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button><button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button><button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button><button type="button" id="authFaceBtn" class="face-key">◉<span>Face ID</span></button><button type="button" data-digit="0">0</button><button type="button" id="pinDelete" aria-label="Delete last digit">⌫</button></div><button class="primary" id="authSubmit" type="submit">Create vault</button></form><p class="hint" id="authHint">Your PIN encrypts vault data on this device. Keep a safe backup of anything important.</p></div></div>
<div id="appScreen" class="app hidden"><header class="top"><div><div class="eyebrow">HG / PRIVATE VAULT</div><h1 id="pageTitle">Your Vault</h1></div><div style="display:flex;gap:7px"><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙ Settings</button><button class="iconbtn" id="lockBtn" aria-label="Lock vault">⌑ Lock</button></div></header><main id="page"></main></div>
<nav id="bottomNav" class="bottom hidden" aria-label="Main navigation"><button class="nav active" data-tab="Vault"><span class="ico">▦</span>Vault</button><button class="nav" data-tab="Notes"><span class="ico">✎</span>Notes</button><button class="nav" data-tab="Voice"><span class="ico">◉</span>Voice</button><button class="nav" data-tab="Files"><span class="ico">▤</span>Files</button><button class="nav" data-tab="Find My"><span class="ico">⌖</span>Find My</button></nav><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORE='hgvault.v1.encrypted', SETUP='hgvault.v1.setup', FACE='hgvault.v1.face', DECOY_STORE='hgvault.v1.decoy.encrypted', DECOY_SETUP='hgvault.v1.decoy.setup', AUTH_MODE='hgvault.v1.authmode';
const DBNAME='hgvault-store-v2', DBSTORE='vault';
function openVaultDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DBNAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(DBSTORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbGet(k){const db=await openVaultDB();return new Promise((resolve,reject)=>{const r=db.transaction(DBSTORE,'readonly').objectStore(DBSTORE).get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbSet(k,v){const db=await openVaultDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DBSTORE,'readwrite');tx.objectStore(DBSTORE).put(v,k);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Storage quota exceeded'))})}
async function persistentStorage(){try{if(navigator.storage?.persist)await navigator.storage.persist()}catch(e){}}
let data={notes:[],media:[],files:[],recordings:[]},key=null,tab='Vault',vaultMode='main',recorder=null,recChunks=[],recStream=null,recStart=0,recTimer=null;
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b)))}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
async function derive(pin,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(){const iv=crypto.getRandomValues(new Uint8Array(12));const plain=enc.encode(JSON.stringify(data));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);const target=vaultMode==='decoy'?DECOY_STORE:STORE;await dbSet(target,{iv:b64(iv),cipher:b64(cipher)});try{localStorage.removeItem(target)}catch(e){}}
async function openData(target=vaultMode==='decoy'?DECOY_STORE:STORE){let obj=await dbGet(target);if(!obj){const legacy=localStorage.getItem(target);if(legacy){obj=JSON.parse(legacy);await dbSet(target,obj);localStorage.removeItem(target)}}if(!obj)throw new Error('Vault data missing');const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.cipher));data=JSON.parse(dec.decode(plain));data.notes ||= [];data.media ||= [];data.files ||= [];data.recordings ||= []}
let first=!localStorage.getItem(SETUP),confirming=false,activePinField='pinInput',faceVerified=false;
async function authMode(){const configured=!!localStorage.getItem(SETUP);let hasMainBlob=false;try{hasMainBlob=!!(await dbGet(STORE))||!!localStorage.getItem(STORE)}catch(e){}first=!(configured&&hasMainBlob);confirming=false;$('#authTitle').textContent=first?'Create your password':'Unlock HG Vault';$('#authSub').textContent=first?'Create and confirm your six-digit password/PIN, then set up Face ID to protect your vault.':'Enter your six-digit PIN to unlock.';$('#authSubmit').textContent=first?'Create vault':'Unlock vault';$('#confirmPin').classList.toggle('hidden',!first);$('#pinInput').value='';$('#confirmPin').value='';activePinField='pinInput';faceVerified=false;$('#authHint').textContent=first?'You must complete Face ID setup before the vault is created. Keep your PIN safe; it cannot be recovered.':'Your vault is encrypted on this device. If Face ID is enabled, authenticate with Face ID and then enter your PIN.';$('#authScreen').classList.remove('hidden');$('#appScreen').classList.add('hidden');$('#bottomNav').classList.add('hidden');setTimeout(()=>$('#pinInput').focus(),100)}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();const pin=$('#pinInput').value;if(!/^\d{6}$/.test(pin)){toast('Enter exactly six digits.');return}try{await persistentStorage();if(first){if(pin!==$('#confirmPin').value){toast('The PINs do not match.');return}if(!crypto.subtle){toast('Encryption requires HTTPS. Open the GitHub Pages site.');return}if(!localStorage.getItem(FACE)){const faceReady=await setupFaceID();if(!faceReady){toast('Face ID setup is required before creating your vault. Try again on this iPhone in Safari.');return}}const salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pin,salt);data={notes:[],media:[],files:[],recordings:[]};await seal();localStorage.setItem(SETUP,JSON.stringify({salt:b64(salt),version:1}));}else{if(localStorage.getItem(FACE)&&localStorage.getItem(AUTH_MODE)!=='pin'&&!faceVerified)await verifyFaceID();faceVerified=false;const decoySetup=JSON.parse(localStorage.getItem(DECOY_SETUP)||'null');let opened=false;if(decoySetup){try{key=await derive(pin,unb64(decoySetup.salt));vaultMode='decoy';await openData(DECOY_STORE);opened=true}catch(e){key=null;vaultMode='main'}}if(!opened){const setup=JSON.parse(localStorage.getItem(SETUP));key=await derive(pin,unb64(setup.salt));vaultMode='main';await openData(STORE)}}$('#authScreen').classList.add('hidden');$('#appScreen').classList.remove('hidden');$('#bottomNav').classList.remove('hidden');tab='Vault';render()}catch(err){key=null;toast(first?'Could not create vault. Try again.':'Incorrect PIN or vault data cannot be decrypted.');$('#pinInput').value='';}}
);
function lock(){if(recorder&&recorder.state==='recording')stopRecording();key=null;data={notes:[],media:[],files:[],recordings:[]};authMode()}
async function verifyFaceID(){const saved=JSON.parse(localStorage.getItem(FACE)||'null');if(!saved)return;const assertion=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(saved.id)}],userVerification:'required',timeout:60000}});if(!assertion)throw new Error('Face ID failed')}
async function setupFaceID(){if(!window.PublicKeyCredential||!navigator.credentials){toast('Face ID setup needs recent iOS Safari.');return false}try{if(localStorage.getItem(FACE)){toast('Face ID is already set up.');return true}const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'HG Vault',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'hg-vault-user',displayName:'HG Vault'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',userVerification:'required'},timeout:60000,attestation:'none'}});if(!cred)throw new Error('No credential');localStorage.setItem(FACE,JSON.stringify({id:b64(cred.rawId),created:Date.now()}));toast('Face ID set up. You will use Face ID and your PIN to unlock.');return true}catch(e){toast('Face ID setup cancelled or unavailable. Use Safari on HTTPS.');return false}}
$('#settingsBtn').onclick=()=>{tab='Settings';render()};
function currentPinField(){const confirm=$('#confirmPin');if(confirm&&!confirm.classList.contains('hidden')&&activePinField==='confirmPin')return confirm;return $('#pinInput');}
$('#pinInput').addEventListener('focus',()=>activePinField='pinInput');
$('#confirmPin').addEventListener('focus',()=>activePinField='confirmPin');
$('#pinInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
$('#confirmPin').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
$('.keypad [data-digit]').forEach(button=>button.addEventListener('click',e=>{e.preventDefault();const field=currentPinField();if(field&&field.value.length<6){field.value+=button.dataset.digit;field.dispatchEvent(new Event('input',{bubbles:true}));}}));
$('#pinDelete').addEventListener('click',e=>{e.preventDefault();const field=currentPinField();if(field){field.value=field.value.slice(0,-1);field.dispatchEvent(new Event('input',{bubbles:true}));}});
$('#authFaceBtn').onclick=async()=>{if(!localStorage.getItem(FACE)){toast('Unlock with your PIN, then set up Face ID from the vault header.');return}try{await verifyFaceID();faceVerified=true;$('#authHint').textContent='Face ID verified. Enter your six-digit PIN to decrypt your vault.';activePinField='pinInput';toast('Face ID verified. Now enter your PIN.')}catch(e){faceVerified=false;toast('Face ID was cancelled or unavailable.')}};
$('#lockBtn').onclick=lock;
$$('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('.nav').forEach(n=>n.classList.toggle('active',n===b));render()});
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function stamp(t){return new Date(t).toLocaleString()}
function heading(title,desc,actions=''){return '<div class="sectionhead"><div><h2>'+title+'</h2><div class="muted" style="font-size:12px;margin-top:4px">'+desc+'</div></div>'+actions+'</div>'}
function empty(title,desc){return '<div class="panel empty"><strong>'+title+'</strong>'+desc+'</div>'}
function render(){if(!key)return;$('#pageTitle').textContent=tab==='Find My'?'Find My':tab==='Vault'?(vaultMode==='decoy'?'Decoy Vault':'Your Vault'):tab;const p=$('#page');if(tab==='Vault')p.innerHTML=vaultPage();if(tab==='Notes')p.innerHTML=notesPage();if(tab==='Voice')p.innerHTML=voicePage();if(tab==='Files')p.innerHTML=filesPage();if(tab==='Find My')p.innerHTML=findPage();if(tab==='Settings')p.innerHTML=settingsPage();wire()}
function vaultPage(){const photos=data.media.filter(x=>x.kind==='image'),videos=data.media.filter(x=>x.kind==='video');return '<div class="panel welcome"><div class="eyebrow">WELCOME BACK</div><h2>Your space. Your control.</h2><p class="muted">A private place for notes, recordings, photos and files.</p><div class="stats"><div class="stat"><b>'+data.notes.length+'</b><span>Notes</span></div><div class="stat"><b>'+photos.length+'</b><span>Photos</span></div><div class="stat"><b>'+videos.length+'</b><span>Videos</span></div></div></div>'+heading('Your media','Import photos and videos from this iPhone','<button data-action="import-media" class="primary">＋ Add media</button>')+'<input id="mediaPicker" type="file" accept="image/*,video/*" multiple class="hidden">'+(data.media.length?'<div class="grid">'+data.media.map(mediaCard).join('')+'</div>':empty('Your media collection is empty','Tap Add media to import photos or videos.'))+heading('Quick actions','Jump straight into a section')+'<div class="grid"><button data-goto="Notes">✎ &nbsp; Write a note</button><button data-goto="Voice">◉ &nbsp; Record audio</button><button data-goto="Files">▤ &nbsp; Import a file</button><button data-goto="Find My">⌖ &nbsp; Apple Find My</button></div><p class="disclaimer" style="margin-top:18px">Encrypted local storage is tied to this browser on this device. Export important items separately; clearing Safari website data can permanently erase this vault.</p>'}
function mediaCard(m){return '<div class="tile">'+(m.kind==='image'?'<img src="'+m.data+'" alt="'+safe(m.name)+'">':'<video controls playsinline preload="metadata" src="'+m.data+'"></video>')+'<h3>'+safe(m.name)+'</h3><p>'+m.kind.toUpperCase()+' · '+bytes(m.size||0)+'</p><div class="actions"><button data-action="export-item" data-id="'+m.id+'" data-group="media">Export</button><button data-action="delete-item" data-id="'+m.id+'" data-group="media">Delete</button></div></div>'}
function notesPage(){return heading('Private notes','Saved encrypted on this device','<button class="primary" data-action="new-note">＋ New note</button>')+'<input id="noteSearch" placeholder="Search your notes…" style="margin-bottom:13px"><div id="noteList" class="list">'+noteRows(data.notes)+'</div>'}
function noteRows(items){if(!items.length)return empty('No notes yet','Create a note to keep your thoughts here.');return items.slice().sort((a,b)=>b.updated-a.updated).map(n=>'<div class="listrow"><div style="font-size:22px">✎</div><div class="info"><h3>'+safe(n.title||'Untitled note')+(n.favorite?' ★':'')+'</h3><p>'+safe(stamp(n.updated))+'</p><div class="notecontent">'+safe(n.body||'No text yet')+'</div></div><div class="actions"><button data-action="edit-note" data-id="'+n.id+'">Open</button><button data-action="delete-item" data-id="'+n.id+'" data-group="notes">Delete</button></div></div>').join('')}
function voicePage(){return heading('Voice notes','Record and replay audio','<button class="primary" id="recordBtn">● Record</button>')+'<div id="recordStatus" class="panel muted">Ready to record. Allow microphone access when Safari asks.</div>'+(data.recordings.length?'<div class="list">'+data.recordings.slice().reverse().map(r=>'<div class="listrow"><div style="font-size:23px">◉</div><div class="info"><h3>'+safe(r.name)+'</h3><p>'+safe(stamp(r.created))+' · '+bytes(r.size)+'</p><audio controls preload="metadata" style="width:100%;margin-top:8px" src="'+r.data+'"></audio></div><div class="actions"><button data-action="export-item" data-id="'+r.id+'" data-group="recordings">Export</button><button data-action="delete-item" data-id="'+r.id+'" data-group="recordings">Delete</button></div></div>').join('')+'</div>':empty('No recordings yet','Your audio recordings will appear here.'))}
function filesPage(){return heading('Your files','Stored in encrypted IndexedDB; available space depends on your iPhone/browser','<button class="primary" data-action="import-files">＋ Import</button>')+'<input id="filePicker" type="file" multiple class="hidden">'+(data.files.length?'<div class="list">'+data.files.slice().reverse().map(f=>'<div class="listrow"><div style="font-size:23px">▤</div><div class="info"><h3>'+safe(f.name)+'</h3><p>'+bytes(f.size)+' · '+safe(stamp(f.created))+'</p></div><div class="actions"><button data-action="export-item" data-id="'+f.id+'" data-group="files">Export</button><button data-action="delete-item" data-id="'+f.id+'" data-group="files">Delete</button></div></div>').join('')+'</div>':empty('No files stored','Import documents or other files from your iPhone.'))+'<p class="disclaimer">Browser storage has limits. Very large files may fail to save; keep original copies elsewhere.</p>'}
function settingsPage(){if(vaultMode==='decoy')return '<div class="panel"><h2>Decoy vault</h2><p class="muted">Settings for the main vault are hidden while you are using the decoy vault.</p></div>';const both=localStorage.getItem(AUTH_MODE)!=='pin';return '<div class="panel"><h2>Unlock method</h2><p class="muted">Face ID setup is required when creating a new vault. Choose whether to use Face ID plus your PIN on unlock, or PIN only after Face ID has been registered.</p><div class="field"><label>Sign-in mode</label><select id="authModeSelect"><option value="both" '+(both?'selected':'')+'>Face ID + PIN</option><option value="pin" '+(!both?'selected':'')+'>PIN only (Face ID remains set up)</option></select></div><button class="primary" id="saveAuthMode">Save unlock method</button><button id="setupFaceSettings" style="margin-left:8px">Set up Face ID</button></div><div class="panel"><h2>Change password / PIN</h2><p class="muted">Choose a new six-digit PIN. You must know your current PIN to change it.</p><div class="field"><label>Current PIN</label><input id="oldPin" type="password" inputmode="numeric" maxlength="6" placeholder="6 digits"></div><div class="field"><label>New PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="6" placeholder="6 digits"></div><div class="field"><label>Confirm new PIN</label><input id="newPinConfirm" type="password" inputmode="numeric" maxlength="6" placeholder="Repeat new PIN"></div><button class="primary" id="changePinBtn">Change PIN</button></div><div class="panel"><h2>Decoy vault</h2><p class="muted">Set a separate six-digit PIN that opens a separate, empty vault. Do not use your main PIN.</p><div class="field"><label>Decoy PIN</label><input id="decoyPin" type="password" inputmode="numeric" maxlength="6" placeholder="6 digits"></div><div class="field"><label>Confirm decoy PIN</label><input id="decoyPinConfirm" type="password" inputmode="numeric" maxlength="6" placeholder="Repeat decoy PIN"></div><button class="primary" id="createDecoyBtn">'+(localStorage.getItem(DECOY_SETUP)?'Replace decoy PIN':'Create decoy vault')+'</button>'+(localStorage.getItem(DECOY_SETUP)?'<p class="disclaimer">A decoy vault is already configured. Replacing it will erase its contents.</p>':'')+'</div><div class="panel"><h2>Storage</h2><p class="muted" id="storageStats">Checking available browser storage…</p><button id="refreshStorage">Refresh storage info</button><p class="disclaimer">Storage cannot be unlimited: Safari limits website storage based on device space. Photos are now resized/compressed before saving to reduce quota errors.</p></div>'}
function wireSettings(){const sel=$('#authModeSelect');if(!sel)return;$('#saveAuthMode').onclick=()=>{if(sel.value==='both'&&!localStorage.getItem(FACE)){toast('Set up Face ID first.');return}localStorage.setItem(AUTH_MODE,sel.value);toast('Unlock method saved.');};$('#setupFaceSettings').onclick=setupFaceID;$('#changePinBtn').onclick=async()=>{const old=$('#oldPin').value,n=$('#newPin').value,n2=$('#newPinConfirm').value;if(!/^\d{6}$/.test(old)||!/^\d{6}$/.test(n)||n!==n2){toast('Enter matching six-digit PINs.');return}try{const cfg=JSON.parse(localStorage.getItem(SETUP));const oldKey=await derive(old,unb64(cfg.salt));const mainObj=await dbGet(STORE);if(!mainObj)throw new Error('Missing vault');await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(mainObj.iv)},oldKey,unb64(mainObj.cipher));const newSalt=crypto.getRandomValues(new Uint8Array(16)),newKey=await derive(n,newSalt),priorKey=key,priorMode=vaultMode;key=newKey;vaultMode='main';await seal();cfg.salt=b64(newSalt);localStorage.setItem(SETUP,JSON.stringify(cfg));key=newKey;vaultMode='main';toast('Main vault PIN changed.');render()}catch(e){toast('Current PIN was wrong or the vault could not be saved.')}};$('#createDecoyBtn').onclick=async()=>{const p=$('#decoyPin').value,p2=$('#decoyPinConfirm').value;if(!/^\d{6}$/.test(p)||p!==p2||p===$('#oldPin').value){toast('Enter matching six-digit decoy PINs, different from your main PIN.');return}if(localStorage.getItem(DECOY_SETUP)&&!confirm('Replace the existing decoy vault and erase its contents?'))return;try{const mainCfg=JSON.parse(localStorage.getItem(SETUP)),mainObj=await dbGet(STORE),testKey=await derive(p,unb64(mainCfg.salt));if(mainObj){try{await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(mainObj.iv)},testKey,unb64(mainObj.cipher));toast('Decoy PIN must be different from the main PIN.');return}catch(e){}}const priorData=data,priorKey=key,priorMode=vaultMode,salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);data={notes:[],media:[],files:[],recordings:[]};vaultMode='decoy';await seal();localStorage.setItem(DECOY_SETUP,JSON.stringify({salt:b64(salt),version:1}));data=priorData;key=priorKey;vaultMode=priorMode;toast('Decoy vault created. Lock and enter its PIN to open it.');render()}catch(e){toast('Could not create decoy vault. Check available storage.')}};$('#refreshStorage').onclick=showStorageStats;showStorageStats()}
async function showStorageStats(){const el=$('#storageStats');if(!el)return;try{const e=await navigator.storage.estimate();el.textContent='Estimated use: '+bytes(e.usage||0)+' · Estimated quota: '+bytes(e.quota||0)+' · Persistent: '+(await navigator.storage.persisted?.()?'yes':'not confirmed')}catch(e){el.textContent='Storage estimate is not available in this browser.'}}
function findPage(){return '<div class="panel welcome"><div class="eyebrow">APPLE SERVICE</div><h2>Find your devices</h2><p class="muted">Open Apple’s official Find Devices service to locate eligible Apple devices linked to your Apple Account.</p><button class="primary" id="findOpen">Open Apple Find My ↗</button></div><div class="panel"><h3>What to expect</h3><p class="muted">Sign in with your Apple Account on Apple’s website. Device location and availability depend on your account, device settings and network connection.</p><p class="disclaimer">HG Vault does not independently track a device or access your location.</p></div>'}
function wire(){const search=$('#noteSearch');if(search)search.oninput=()=>{$('#noteList').innerHTML=noteRows(data.notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(search.value.toLowerCase())));wireActions()};wireActions();const rec=$('#recordBtn');if(rec)rec.onclick=toggleRecording;const f=$('#findOpen');if(f)f.onclick=()=>window.open('https://www.icloud.com/find','_blank','noopener');wireSettings();}
function wireActions(){$$('[data-action]').forEach(b=>{if(b.dataset.wired)return;b.dataset.wired='1';b.onclick=()=>action(b.dataset.action,b.dataset.id,b.dataset.group)});$$('[data-goto]').forEach(b=>{if(b.dataset.wired)return;b.dataset.wired='1';b.onclick=()=>{tab=b.dataset.goto;$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));render()}})}
async function action(a,id,group){if(a==='new-note'||a==='edit-note'){const old=data.notes.find(n=>n.id===id);noteEditor(old);return}if(a==='import-media'){$('#mediaPicker').click();return}if(a==='import-files'){$('#filePicker').click();return}if(a==='delete-item'){if(!confirm('Delete this item from HG Vault?'))return;data[group]=data[group].filter(x=>x.id!==id);await persistRender();return}if(a==='export-item'){const item=data[group].find(x=>x.id===id);if(item)downloadItem(item);return}}
function noteEditor(old){const overlay=document.createElement('div');overlay.className='screen';overlay.style.cssText='position:fixed;inset:0;z-index:10;background:#08070df5;align-items:flex-start;overflow:auto';overlay.innerHTML='<div style="width:min(100%,550px);margin:20px auto"><div class="top"><h2>'+(old?'Edit note':'New note')+'</h2><button id="closeEditor">Close</button></div><div class="field"><label>Title</label><input id="noteTitle" maxlength="120" placeholder="Note title" value="'+safe(old?.title||'')+'"></div><div class="field"><label>Note</label><textarea id="noteBody" rows="10" placeholder="Write something…">'+safe(old?.body||'')+'</textarea></div><label style="display:flex;gap:10px;align-items:center;margin:15px 0"><input id="noteFav" type="checkbox" style="width:auto" '+(old?.favorite?'checked':'')+'> Favourite</label><button id="saveNote" class="primary" style="width:100%">Save note</button></div>';document.body.append(overlay);overlay.querySelector('#closeEditor').onclick=()=>overlay.remove();overlay.querySelector('#saveNote').onclick=async()=>{const title=overlay.querySelector('#noteTitle').value.trim(),body=overlay.querySelector('#noteBody').value;if(!title&&!body){toast('Add a title or some text first.');return}const note={id:old?.id||crypto.randomUUID(),title:title||'Untitled note',body,favorite:overlay.querySelector('#noteFav').checked,created:old?.created||Date.now(),updated:Date.now()};if(old)data.notes=data.notes.map(n=>n.id===old.id?note:n);else data.notes.push(note);overlay.remove();await persistRender()}}
async function persistRender(){try{await seal();render()}catch(e){toast(e?.name==='QuotaExceededError'||/quota/i.test(e?.message||'')?'Storage is full for this website. Export/delete items or free iPhone storage; unlimited browser storage is not possible.':'Could not save this item. Try a smaller file.')}}
function downloadItem(item){const a=document.createElement('a');a.href=item.data;a.download=item.name||'HG-Vault-export';document.body.append(a);a.click();a.remove()}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function compressPhoto(file){if(!file.type.startsWith('image/')||file.type==='image/gif')return file;try{const url=URL.createObjectURL(file);const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=url});const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));if(scale===1&&file.size<1800000){URL.revokeObjectURL(url);return file}const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);return await new Promise(resolve=>canvas.toBlob(b=>resolve(b||file),'image/jpeg',.78))}catch(e){return file}}
async function importSelected(files,group){let added=0;for(const file of files){try{const processed=group==='media'&&file.type.startsWith('image/')?await compressPhoto(file):file;const d=await readFile(processed);const item={id:crypto.randomUUID(),name:file.name,size:processed.size,type:processed.type||file.type,data:d,created:Date.now()};if(group==='media'){item.kind=file.type.startsWith('video/')?'video':'image';if(!file.type.startsWith('video/')&&!file.type.startsWith('image/'))continue;data.media.push(item)}else data.files.push(item);added++}catch(e){toast('Could not read '+file.name)}}await persistRender();if(added)toast('Added '+added+' item(s).');else toast('Nothing was imported.')}
document.addEventListener('change',e=>{if(e.target.id==='mediaPicker'&&e.target.files.length)importSelected([...e.target.files],'media');if(e.target.id==='filePicker'&&e.target.files.length)importSelected([...e.target.files],'files')});
async function toggleRecording(){if(recorder&&recorder.state==='recording'){stopRecording();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Audio recording is not supported in this browser.');return}try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(recStream);recChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};recorder.onstop=async()=>{clearInterval(recTimer);recStream?.getTracks().forEach(t=>t.stop());const blob=new Blob(recChunks,{type:recorder.mimeType||'audio/webm'});const fr=new FileReader();fr.onload=async()=>{data.recordings.push({id:crypto.randomUUID(),name:'Voice note '+new Date().toLocaleString(),created:Date.now(),size:blob.size,type:blob.type,data:fr.result});await persistRender()};fr.readAsDataURL(blob)};recorder.start();$('#recordBtn').textContent='■ Stop recording';$('#recordStatus').textContent='Recording… 0:00';recStart=Date.now();recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);const el=$('#recordStatus');if(el)el.textContent='Recording… '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500)}catch(e){toast('Microphone access was denied or unavailable.')}}function stopRecording(){if(recorder&&recorder.state==='recording'){recorder.stop();$('#recordBtn')&&($('#recordBtn').textContent='● Record')}}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
authMode();
</script></body></html>
